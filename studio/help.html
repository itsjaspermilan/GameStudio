<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameStudio Help</title>
    <script>
      // the same look as the studio before the first paint (src/theme.js keeps it current)
      (function () {
        var d = document.documentElement, pick = "", ua = navigator.userAgent;
        try { pick = localStorage.getItem("gs.look") || ""; } catch (e) {}
        d.dataset.os = /Mac/.test(ua) ? "mac" : /Windows/.test(ua) ? "windows" : "other";
        d.dataset.scheme = pick === "light" || pick === "dark" ? pick : window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      })();
    </script>
  </head>
  <body class="help-page">
    <div id="help-root"></div>
    <script type="module" src="/src/help-window.js"></script>
  </body>
</html>
