[package]
name = "gamestudio-studio"
version = "0.1.0"
edition = "2021"
license = "Zlib"

[lib]
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
tauri-plugin-dialog = "2"
